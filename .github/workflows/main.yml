
name: Enterprise CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

      deploy_tests:
        description: "Run integration/unit tests?"
        required: false
        default: true
        type: boolean

# Least-privilege default permissions
permissions:
  contents: read

# Only one workflow run at a time across this repository.
# A new run cancels the previous run.
concurrency:
  group: zomato-ci-global
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/zomato_new
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ============================================
  # JOB 1: React Build, Tests and CodeQL
  # ============================================
  build:
    name: Build React Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Display Versions
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Verify Installed Packages
        run: npm ls --depth=0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_tests }}
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build React Application
        run: npm run build

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Upload React Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          if-no-files-found: error
          retention-days: 1

  # ============================================
  # JOB 2: Security Scan and Docker Build
  # ============================================
  security:
    name: Security and Docker Validation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download React Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build/

      # ------------------------------------------
      # Trivy Security Scan
      # ------------------------------------------
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.72.0

      - name: Verify Trivy
        run: trivy --version

      - name: Run Trivy Filesystem Scan
        continue-on-error: true
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --format sarif \
            --output trivy-fs.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            .

      - name: Upload Trivy Results
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif

      # ------------------------------------------
      # Dockerfile Lint
      # ------------------------------------------
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # ------------------------------------------
      # Docker Build
      # ------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.title=Zomato
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify Docker Image
        run: |
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}"
          docker images

      # ------------------------------------------
      # Docker Hub Login and Push
      # Skip publishing for pull requests
      # ------------------------------------------
      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"

      # ------------------------------------------
      # Container Smoke Test
      # ------------------------------------------
      - name: Run Container Smoke Test
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker run -d \
            --name zomato-test \
            -p 8080:80 \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          for i in {1..15}; do
            if curl --fail --silent http://localhost:8080/ > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done

          echo "Smoke test failed"
          docker logs zomato-test || true
          exit 1

      # ------------------------------------------
      # Cleanup
      # ------------------------------------------
      - name: Cleanup Container
        if: always()
        run: docker rm -f zomato-test || true
